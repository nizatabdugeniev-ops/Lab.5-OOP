<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мини-приложение «Расходы» — JavaScript • DOM</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #f87171;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top right, #1d4ed8 0%, transparent 40%),
        radial-gradient(circle at bottom left, #0ea5e9 0%, transparent 35%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(560px, 100%);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    h1 { margin: 0 0 6px; font-size: 1.45rem; }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 140px auto;
      gap: 8px;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #0b1220;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      background: #0ea5e9;
      color: white;
    }

    button:hover { filter: brightness(1.08); }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1220;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .total span { color: var(--muted); font-size: 0.85rem; }

    #total {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-2);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    li {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      background: #0b1220;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .name { word-break: break-word; }
    .sum { font-weight: 700; white-space: nowrap; }

    .del {
      background: #7f1d1d;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px 8px;
    }

    .error {
      min-height: 1.2em;
      margin: 0 0 10px;
      color: var(--danger);
      font-size: 0.85rem;
    }

    .hint {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Расходы</h1>
    <p class="subtitle">JavaScript • DOM • динамический список</p>

    <form id="form">
      <input id="title" type="text" placeholder="Название расхода" required />
      <input id="amount" type="number" min="0" step="0.01" placeholder="Сумма" required />
      <button type="submit">Добавить</button>
    </form>

    <p class="error" id="error"></p>

    <div class="total">
      <span>Общая сумма</span>
      <strong id="total">0</strong>
    </div>

    <ul id="list"></ul>

    <p class="hint">Список строится через createElement. Удаление меняет массив и перерисовывает DOM.</p>
  </main>

  <script>
    const form = document.getElementById("form");
    const titleInput = document.getElementById("title");
    const amountInput = document.getElementById("amount");
    const listEl = document.getElementById("list");
    const totalEl = document.getElementById("total");
    const errorEl = document.getElementById("error");

    const expenses = [];
    let nextId = 1;

    function formatMoney(value) {
      return value.toLocaleString("ru-RU", {
        minimumFractionDigits: Number.isInteger(value) ? 0 : 2,
        maximumFractionDigits: 2
      });
    }

    function render() {
      listEl.innerHTML = "";

      if (expenses.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "Пока нет расходов";
        listEl.appendChild(empty);
      } else {
        expenses.forEach((item) => {
          const li = document.createElement("li");

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = item.title;

          const sum = document.createElement("div");
          sum.className = "sum";
          sum.textContent = formatMoney(item.amount);

          const del = document.createElement("button");
          del.type = "button";
          del.className = "del";
          del.textContent = "Удалить";
          del.addEventListener("click", () => removeExpense(item.id));

          li.append(name, sum, del);
          listEl.appendChild(li);
        });
      }

      const total = expenses.reduce((acc, item) => acc + item.amount, 0);
      totalEl.textContent = formatMoney(total);
    }

    function removeExpense(id) {
      const index = expenses.findIndex((item) => item.id === id);
      if (index !== -1) expenses.splice(index, 1);
      render();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      errorEl.textContent = "";

      const title = titleInput.value.trim();
      const amount = Number(amountInput.value);

      if (!title) {
        errorEl.textContent = "Введите название расхода.";
        return;
      }

      if (amountInput.value === "" || Number.isNaN(amount) || amount < 0) {
        errorEl.textContent = "Введите корректную сумму (0 или больше).";
        return;
      }

      expenses.push({ id: nextId++, title, amount });
      form.reset();
      titleInput.focus();
      render();
    });

    render();
  </script>
</body>
</html>
